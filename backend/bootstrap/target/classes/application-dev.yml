spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistics}
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate    # Use Flyway in production
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

logging:
  level:
    com.logistics: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG