spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:logistics}
    username: ${DB_USERNAME:logistics}
    password: ${DB_PASSWORD:logistics}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate    # Use Flyway in production
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC
    show-sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail: 
        smtp:
          auth: true
          starttls:
            enable: true

identity:
  jwt:
    issuer: real-time-logistics
    audience: logistics-api
    secret: ${JWT_SECRET}
    access-token-ttl: 15m

  email:
    from: ${MAIL_FROM}
  password-reset:
    base-url: ${PASSWORD_RESET_BASE_URL}

logging:
  level:
    com.logistics: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG